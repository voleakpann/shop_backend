# MiniStore backend — full stack for a single host.
#   docker compose up --build
#
# Config/secrets come from a .env file next to this one (see .env.example).
# Spring Boot's relaxed env binding lets these override whatever is in each
# service's application.yml — e.g. SPRING_DATASOURCE_URL wins over spring.datasource.url.
#
# mem_limit + JAVA_TOOL_OPTIONS keep each JVM within a RAM budget so the whole
# stack fits a small (2 GB) VM. restart: unless-stopped brings services back
# after a crash or a VM reboot.
services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # Published so pgAdmin/DataGrip on the host can connect (5434, since 5432
    # is already taken by the native Windows Postgres install).
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  discovery-server:
    build: ./discovery-server
    restart: unless-stopped
    mem_limit: 350m
    environment:
      SERVER_PORT: 7000
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    ports:
      - "7000:7000"   # Eureka dashboard

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    mem_limit: 350m
    ports:
      - "8000:8000"   # the ONLY port your frontend should call
    environment:
      SERVER_PORT: 8000
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:7000/eureka/
    depends_on:
      - discovery-server

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    mem_limit: 420m
    # Published publicly for Swagger access (needs security-group rule for :9001).
    ports:
      - "9001:9001"
    environment:
      SERVER_PORT: 9001
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:7000/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ministore_auth
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  product-service:
    build: ./product-service
    restart: unless-stopped
    mem_limit: 420m
    # Published publicly for Swagger access (needs security-group rule for :1000).
    ports:
      - "1000:1000"
    environment:
      SERVER_PORT: 1000
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:7000/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ministore_products
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  order-service:
    build: ./order-service
    restart: unless-stopped
    mem_limit: 450m
    # Published publicly for Swagger access (needs security-group rule for :9002).
    # Note: moved off 2000 because many corporate/ISP firewalls filter that port.
    ports:
      - "9002:9002"
    environment:
      SERVER_PORT: 9002
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:7000/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ministore_orders
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  comment-service:
    build: ./comment-service
    restart: unless-stopped
    mem_limit: 420m
    # Published publicly for Swagger access (needs security-group rule for :9003).
    ports:
      - "9003:9003"
    environment:
      SERVER_PORT: 9003
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
      # Registers under this id so the gateway's lb://comment-service can route to it.
      SPRING_APPLICATION_NAME: comment-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:7000/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ministore_comments
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      # Auto-create the comments table (this service has no application.yml).
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      # comment-service reads ${ministore.jwt.secret} (not jwt.secret), so it
      # needs the value under this env name too, or it fails to start.
      MINISTORE_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started

  # Next.js frontend. Its repo is cloned alongside this one at ../shop_front
  # (so build context "../shop_front" resolves on the server). Caddy serves it
  # at the site root and proxies /api and /oauth2 to the backend.
  frontend:
    build:
      context: ../shop_front
      # NEXT_PUBLIC_* are inlined at BUILD time, so they must be build args.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${FRONTEND_BASE_URL:-https://camministore.duckdns.org}
        NEXT_PUBLIC_AUTH_BASE_URL: ${FRONTEND_BASE_URL:-https://camministore.duckdns.org}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    mem_limit: 400m
    environment:
      NODE_ENV: production
      # NextAuth (Auth.js v5) runs behind Caddy; it needs a secret, must trust
      # the proxy host, and reuses the same Google client as auth-service.
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${FRONTEND_BASE_URL:-https://camministore.duckdns.org}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
    expose:
      - "3000"   # internal only; Caddy reaches it as frontend:3000
    depends_on:
      - api-gateway

  # Reverse proxy + automatic HTTPS (Let's Encrypt). This is the public entry
  # point: it serves the whole site at https://camministore.duckdns.org and
  # routes to frontend / api-gateway / auth-service per ./Caddyfile.
  # Requires security-group inbound rules for 80 and 443, and a DNS record
  # (DuckDNS) pointing camministore.duckdns.org at this host's public IP.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api-gateway
      - auth-service

volumes:
  pgdata:
  caddy_data:
  caddy_config:

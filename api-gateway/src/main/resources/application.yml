server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Route requests to services discovered via Eureka (lb:// = load-balanced)
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/oauth2/**,/login/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
      # Global CORS so the Next.js frontend (localhost:3000) can call the API
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
